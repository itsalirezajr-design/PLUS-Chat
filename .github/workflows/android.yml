name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: PLUS Chat latest APK
          body: Automated debug APK build from the latest main branch.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          fail_on_unmatched_files: true
